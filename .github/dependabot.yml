version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      development-tooling:
        dependency-type: development
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
    ignore:
      # Major releases can raise their Node.js floor beyond the supported runtime range.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: commander
        update-types:
          - version-update:semver-major
      # Keep TypeScript within typescript-eslint's declared peer range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
