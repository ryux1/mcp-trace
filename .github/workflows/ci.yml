name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22, 24]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete verification gate
        run: pnpm verify

      - name: Inspect package contents
        run: pnpm pack --dry-run

      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  consumer:
    name: Package consumer (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Verify stdio lifecycle and SDK interoperability
        run: pnpm exec vitest run test/stdio.test.ts test/official-sdk.integration.test.ts

      - name: Verify clean consumer installation
        run: pnpm smoke:package

      - name: Run the local end-to-end demo
        run: pnpm demo

  python-interop:
    name: Python SDK interoperability
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.10

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated Python fixture
        working-directory: test/fixtures/python-sdk
        run: uv sync --frozen

      - name: Verify Python SDK through MCP Trace
        env:
          MCP_TRACE_PYTHON_INTEROP: "1"
        run: pnpm exec vitest run test/python-sdk.integration.test.ts

  container:
    name: Container (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container
        run: docker build --tag mcp-trace:ci .

      - name: Verify image architecture
        run:
          test "$(docker image inspect mcp-trace:ci --format '{{.Architecture}}')" = "${{
          matrix.architecture }}"

      - name: Smoke test container
        run: |
          docker run --detach --name mcp-trace-ci \
            --publish 127.0.0.1:7331:7331 \
            mcp-trace:ci proxy \
            --host 0.0.0.0 \
            --allow-host 127.0.0.1 \
            --upstream http://127.0.0.1:3001/mcp
          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 1 --retry-connrefused --retry-all-errors \
            http://127.0.0.1:7331/__mcp_trace/healthz)"
          test "$response" = \
            '{"status":"ok","upstream":"http://127.0.0.1:3001/mcp"}'

      - name: Show container logs and clean up
        if: always()
        run: |
          docker logs mcp-trace-ci || true
          docker rm --force mcp-trace-ci >/dev/null 2>&1 || true
