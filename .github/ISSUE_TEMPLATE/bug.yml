name: Bug report
description: Report a reproducible MCP Trace defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, production recordings, and personal data. Report security vulnerabilities privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: MCP Trace version
      placeholder: 0.1.1
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: MCP protocol revision
      options:
        - 2026-07-28
        - 2025-11-25 or earlier Streamable HTTP
        - Unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized commands, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Node version, operating system, container/runtime, upstream type
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and personal data.
          required: true
